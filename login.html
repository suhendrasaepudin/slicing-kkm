<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="/assets/css/login-style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  </head>
  <body>
    <!-- Logo Header -->
    <header class="logo-bar bg-transparent my-5 pb-4">
      <div class="container">
        <div class="w-100 d-flex justify-content-center">
          <a class="logo-link" href="#">
            <img src="/assets/images/logo/logo-untirta.png" alt="Logo Untirta" height="40" />
          </a>
          <a class="logo-link" href="#">
            <img src="/assets/images/logo/logo-kampus-merdeka.png" alt="Logo Kampus Merdeka" height="40" />
          </a>
          <a class="logo-link" href="#">
            <img src="/assets/images/logo/logo-blu-promise.png" alt="Logo BLU Promise" height="40" />
          </a>
        </div>
      </div>
    </header>
    <!-- Form Login -->
    <main>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="row gy-4 justify-content-center">
              <div class="col-lg-3">
                <img src="/assets/images/logo/logo-app-kkm.png" alt="Logo KKM" height="100" />
                <h3 class="fw-bold">Kuliah Kerja Mahasiswa</h3>
                <p class="fs-5">by Universitas Sultan Ageng Tirtayasa</p>
              </div>
              <div class="col-lg-4">
                <div class="card border-0 border-radius-custom">
                  <div class="card-body p-4">
                    <form class="mb-5">
                      <h5 class="fw-bold mb-0">Masuk</h5>
                      <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control form-control-lg form-custom-border" id="email" name="email" />
                      </div>
                      <div class="mb-3">
                        <label for="password" class="form-label">Kata Sandi</label>
                        <input type="password" class="form-control form-control-lg form-custom-border" id="password" name="password" />
                      </div>
                      <button type="submit" class="w-100 btn btn-primary py-3">Masuk</button>
                    </form>
                  </div>
                </div>
              </div>
              <div class="col-lg-3">
                <div class="card border-0 border-radius-custom">
                  <div class="card-body py-3 px-4">
                    <ul class="ps-0 custom-ul-li">
                      <li>
                        Lupa kata sandi?
                        <a href="http://" class="text-decoration-none" rel="noopener noreferrer">Lupa</a>
                      </li>
                      <li>
                        Belum punya akun?
                        <a href="http://" class="text-decoration-none" rel="noopener noreferrer">
                          <br />
                          Daftar akun KKM
                        </a>
                      </li>
                      <li>
                        atau Masuk sebagai Pembimbing
                        <a href="/login-pembimbing.html" class="text-decoration-none" rel="noopener noreferrer">
                          <br />
                          Masuk
                        </a>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="custom-fixed-bottom d-flex justify-content-center">
      <img src="/assets/images/image-login.png" alt="Image Login" height="280" />
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
  </body>
</html>
